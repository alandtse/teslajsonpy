name: semantic_release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: semantic_release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Git
        run: |
          git config --global user.name "semantic-release"
          git config --global user.email "semantic-release@GitHub"
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          commit: true
          push: true
      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          password: ${{ secrets.TESLA_PYPY_TOKEN }}
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: make init
      - name: Make documentation
        run: make docs
      - name: Commit docs
        run: |
          git pull
          git add docs
          if git diff --cached --quiet; then
            echo "No documentation changes"
          else
            git commit -m "docs: update documentation"
            git push
          fi
      - name: Push changes to dev
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          branch: dev
        if: always()
